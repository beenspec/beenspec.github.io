<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title></title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 20% 15%, rgba(42, 115, 255, 0.45), transparent 32%),
        radial-gradient(circle at 80% 85%, rgba(166, 70, 255, 0.42), transparent 36%),
        linear-gradient(135deg, #010109, #070012 55%, #010109);
      color: white;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow: hidden;
    }

    .bg-glow {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 25% 30%, rgba(48, 120, 255, 0.28), transparent 18%),
        radial-gradient(circle at 70% 60%, rgba(180, 75, 255, 0.24), transparent 20%),
        radial-gradient(circle at 50% 50%, rgba(95, 55, 255, 0.18), transparent 28%);
      filter: blur(22px);
      animation: floatGlow 8s ease-in-out infinite alternate;
    }

    .container {
      width: min(92vw, 720px);
      padding: 36px;
      border-radius: 32px;
      background:
        linear-gradient(rgba(8, 8, 24, 0.86), rgba(8, 8, 24, 0.86)) padding-box,
        linear-gradient(135deg, rgba(65, 135, 255, 0.95), rgba(178, 75, 255, 0.95)) border-box;
      border: 2px solid transparent;
      backdrop-filter: blur(22px);
      position: relative;
      overflow: hidden;
    }

    .container::before {
      content: "";
      position: absolute;
      inset: -2px;
      border-radius: inherit;
      background:
        radial-gradient(circle at 20% 10%, rgba(70, 140, 255, 0.85), transparent 26%),
        radial-gradient(circle at 85% 85%, rgba(190, 80, 255, 0.8), transparent 28%);
      filter: blur(18px);
      opacity: 0.8;
      z-index: -1;
      animation: pulseGlow 3.8s ease-in-out infinite alternate;
    }

    .container::after {
      content: "";
      position: absolute;
      inset: 1px;
      border-radius: 30px;
      pointer-events: none;
      background:
        linear-gradient(90deg, transparent, rgba(88, 150, 255, 0.32), transparent),
        linear-gradient(180deg, transparent, rgba(186, 80, 255, 0.22), transparent);
      mix-blend-mode: screen;
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(34px, 7vw, 70px);
      line-height: 0.95;
      letter-spacing: -0.07em;
      background: linear-gradient(135deg, #70a7ff, #c77aff, #ffffff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: brightness(1.18);
    }

    p {
      margin: 0 0 28px;
      color: rgba(255, 255, 255, 0.64);
      font-size: 16px;
    }

    .search-wrap {
      position: relative;
      padding: 2px;
      border-radius: 24px;
      background:
        linear-gradient(rgba(5, 5, 16, 0.9), rgba(5, 5, 16, 0.9)) padding-box,
        linear-gradient(135deg, #2f7bff, #a24dff, #4a7dff) border-box;
      border: 2px solid transparent;
      overflow: hidden;
      isolation: isolate;
    }

    .search-wrap::before {
      content: "";
      position: absolute;
      inset: -35%;
      background:
        radial-gradient(circle at 20% 50%, rgba(55, 130, 255, 0.9), transparent 24%),
        radial-gradient(circle at 80% 50%, rgba(180, 70, 255, 0.9), transparent 24%),
        conic-gradient(from 90deg, transparent, rgba(60, 130, 255, 0.9), rgba(185, 75, 255, 0.9), transparent);
      filter: blur(24px);
      opacity: 0.95;
      animation: spin 5s linear infinite;
      z-index: -1;
    }

    .search-inner {
      position: relative;
      display: flex;
      gap: 12px;
      padding: 14px;
      border-radius: 20px;
      background: rgba(5, 5, 16, 0.96);
      backdrop-filter: blur(18px);
      z-index: 1;
    }

    input {
      width: 100%;
      border: 1px solid rgba(110, 160, 255, 0.16);
      outline: 0;
      color: white;
      background:
        radial-gradient(circle at 15% 50%, rgba(56, 125, 255, 0.18), transparent 36%),
        rgba(255, 255, 255, 0.07);
      padding: 18px 20px;
      border-radius: 18px;
      font-size: 17px;
    }

    input:focus {
      border-color: rgba(150, 105, 255, 0.75);
      background:
        radial-gradient(circle at 20% 50%, rgba(70, 140, 255, 0.24), transparent 42%),
        radial-gradient(circle at 80% 50%, rgba(170, 75, 255, 0.22), transparent 38%),
        rgba(255, 255, 255, 0.09);
    }

    input::placeholder {
      color: rgba(255, 255, 255, 0.48);
    }

    button {
      border: 1px solid rgba(255, 255, 255, 0.18);
      cursor: pointer;
      color: white;
      padding: 0 28px;
      border-radius: 18px;
      font-size: 16px;
      font-weight: 800;
      background:
        radial-gradient(circle at 30% 20%, rgba(255, 255, 255, 0.35), transparent 28%),
        linear-gradient(135deg, #2878ff, #9c4dff);
      position: relative;
      overflow: hidden;
    }

    button::before {
      content: "";
      position: absolute;
      inset: -35%;
      background:
        radial-gradient(circle, rgba(140, 190, 255, 0.8), transparent 32%),
        radial-gradient(circle at 70% 70%, rgba(210, 120, 255, 0.75), transparent 34%);
      filter: blur(12px);
      opacity: 0.6;
      animation: pulseGlow 2.6s ease-in-out infinite alternate;
      z-index: 0;
    }

    button span {
      position: relative;
      z-index: 1;
    }

    button:hover {
      background:
        radial-gradient(circle at 30% 20%, rgba(255, 255, 255, 0.44), transparent 28%),
        linear-gradient(135deg, #4b8dff, #b96aff);
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes pulseGlow {
      from {
        opacity: 0.45;
        filter: blur(12px) brightness(1);
      }

      to {
        opacity: 0.95;
        filter: blur(22px) brightness(1.3);
      }
    }

    @keyframes floatGlow {
      from {
        transform: translate3d(-18px, -14px, 0) scale(1);
        opacity: 0.68;
      }

      to {
        transform: translate3d(18px, 16px, 0) scale(1.08);
        opacity: 1;
      }
    }

    @media (max-width: 560px) {
      .container {
        padding: 24px;
      }

      .search-inner {
        flex-direction: column;
      }

      button {
        height: 54px;
      }
    }
  </style>
</head>
<body>
  <div class="bg-glow"></div>

  <main class="container">
    <h1>apple luqid glass ahh prxey</h1>
    <p>Type a website or search anything.</p>

    <div class="search-wrap">
      <div class="search-inner">
        <input id="searchBox" autocomplete="off" autofocus placeholder="Search or enter a website" />
        <button id="goButton"><span>Go</span></button>
      </div>
    </div>
  </main>

  <script>
    const input = document.getElementById("searchBox");
    const button = document.getElementById("goButton");

    function submitSearch() {
      const value = input.value.trim();
      if (!value) return;

      window.parent.postMessage({
        type: "open-url",
        value
      }, "*");
    }

    button.addEventListener("click", submitSearch);

    input.addEventListener("keydown", event => {
      if (event.key === "Enter") {
        submitSearch();
      }
    });
  </script>
</body>
</html>
