<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      background:
        radial-gradient(circle at 20% 15%, rgba(42, 115, 255, 0.45), transparent 32%),
        radial-gradient(circle at 80% 85%, rgba(166, 70, 255, 0.42), transparent 36%),
        linear-gradient(135deg, #010109, #070012 55%, #010109);
      color: white;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow: hidden;
    }

    button,
    input {
      font-family: inherit;
    }

    header {
      height: 72px;
      padding: 18px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(130, 160, 255, 0.25);
      background: rgba(8, 8, 24, 0.78);
      backdrop-filter: blur(18px);
    }

    .title {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 22px;
      font-weight: 900;
      letter-spacing: -0.04em;
      background: linear-gradient(135deg, #8db6ff, #d48aff, #ffffff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .title i {
      color: #a881ff;
      background: none;
      -webkit-background-clip: initial;
      background-clip: initial;
    }

    .status {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.6);
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    main {
      overflow: hidden;
      min-height: 0;
      display: grid;
      grid-template-rows: 1fr;
    }

    #messages {
      padding: 18px;
      overflow-y: auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .msg {
      width: fit-content;
      max-width: min(760px, 78%);
      padding: 12px 14px;
      border-radius: 20px;
      word-break: break-word;
      border: 1px solid rgba(255, 255, 255, 0.09);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.18);
    }

    .msg.other {
      align-self: flex-start;
      background:
        radial-gradient(circle at 10% 20%, rgba(255, 255, 255, 0.08), transparent 38%),
        rgba(255, 255, 255, 0.085);
      border-bottom-left-radius: 8px;
    }

    .msg.mine {
      align-self: flex-end;
      background:
        radial-gradient(circle at 20% 10%, rgba(255, 255, 255, 0.22), transparent 34%),
        linear-gradient(135deg, rgba(38, 117, 255, 0.94), rgba(88, 92, 255, 0.94));
      border-color: rgba(130, 180, 255, 0.35);
      border-bottom-right-radius: 8px;
    }

    .msg-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 7px;
    }

    .name {
      font-weight: 1000;
      font-size: 14px;
      letter-spacing: -0.02em;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.1);
      text-shadow: 0 0 12px currentColor;
    }

    .name.rainbow {
      background: linear-gradient(90deg, #ff4fd8, #ffb84f, #70ff8f, #54c7ff, #b06cff, #ff4fd8);
      background-size: 300% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: rainbowMove 4s linear infinite;
      text-shadow: none;
      padding: 0;
    }

    .mine .name {
      color: white;
      text-shadow: 0 0 12px rgba(255, 255, 255, 0.65);
    }

    .time {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.48);
      white-space: nowrap;
    }

    .text {
      color: rgba(255, 255, 255, 0.92);
      line-height: 1.45;
      font-size: 14px;
    }

    .text a {
      color: #dbe7ff;
      font-weight: 900;
      text-decoration: underline;
      text-decoration-color: rgba(255, 255, 255, 0.35);
    }

    .other .text a {
      color: #8db6ff;
    }

    footer {
      padding: 14px;
      border-top: 1px solid rgba(130, 160, 255, 0.22);
      background: rgba(8, 8, 24, 0.8);
      display: grid;
      grid-template-columns: 150px 1fr auto;
      gap: 10px;
    }

    #nameInput,
    #msgInput {
      height: 44px;
      border-radius: 16px;
      border: 1px solid rgba(110, 160, 255, 0.18);
      outline: 0;
      color: white;
      background: rgba(255, 255, 255, 0.08);
      padding: 0 14px;
    }

    #nameInput:focus,
    #msgInput:focus {
      border-color: rgba(150, 105, 255, 0.75);
      background: rgba(255, 255, 255, 0.11);
    }

    #sendBtn {
      height: 44px;
      padding: 0 22px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      color: white;
      font-weight: 900;
      cursor: pointer;
      background: linear-gradient(135deg, #2878ff, #9c4dff);
    }

    #sendBtn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    #warn {
      position: fixed;
      left: 18px;
      bottom: 78px;
      max-width: min(560px, calc(100vw - 36px));
      color: #ffb1d7;
      font-size: 12px;
      line-height: 1.4;
      padding: 10px 12px;
      border-radius: 14px;
      display: none;
      background: rgba(45, 10, 30, 0.82);
      border: 1px solid rgba(255, 120, 190, 0.28);
      backdrop-filter: blur(16px);
    }

    .system {
      align-self: center;
      max-width: 820px;
      padding: 12px 14px;
      border-radius: 18px;
      color: rgba(255, 255, 255, 0.68);
      background: rgba(255, 255, 255, 0.045);
      border: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 13px;
    }

    @keyframes rainbowMove {
      from {
        background-position: 0% 50%;
      }

      to {
        background-position: 300% 50%;
      }
    }

    @media (max-width: 760px) {
      header {
        height: 64px;
        padding: 14px 16px;
      }

      .title {
        font-size: 18px;
      }

      .msg {
        max-width: 88%;
      }

      footer {
        grid-template-columns: 1fr;
      }

      #warn {
        bottom: 164px;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="title">
      <i class="bi bi-chat-dots"></i>
      <span>Global Chat</span>
    </div>
    <div class="status" id="status">connecting</div>
  </header>

  <main>
    <section id="messages">
      <div class="system">Global chat is loading. Links like example.com or https://example.com are clickable and open in the browser shell.</div>
    </section>
  </main>

  <div id="warn"></div>

  <footer>
    <input id="nameInput" maxlength="18" placeholder="name">
    <input id="msgInput" maxlength="350" placeholder="message or website">
    <button id="sendBtn">Send</button>
  </footer>

  <script>
    const messages = document.getElementById("messages");
    const statusEl = document.getElementById("status");
    const nameInput = document.getElementById("nameInput");
    const msgInput = document.getElementById("msgInput");
    const sendBtn = document.getElementById("sendBtn");
    const warn = document.getElementById("warn");

    let socket = null;
    let lastSent = 0;
    let reconnectTimer = null;

    const CLIENT_KEY = "chatClientId";
    const COLOR_KEY = "chatNameColor";
    const RAINBOW_KEY = "chatRainbowName";

    let clientId = localStorage.getItem(CLIENT_KEY);

    if (!clientId) {
      clientId = "client_" + Date.now() + "_" + Math.random().toString(16).slice(2);
      localStorage.setItem(CLIENT_KEY, clientId);
    }

    nameInput.value = localStorage.getItem("chatName") || "";

    function getNameColor() {
      return localStorage.getItem(COLOR_KEY) || "#8db6ff";
    }

    function getRainbowEnabled() {
      return localStorage.getItem(RAINBOW_KEY) === "true";
    }

    function showWarn(text) {
      warn.textContent = text;
      warn.style.display = text ? "block" : "none";

      if (text) {
        clearTimeout(showWarn.timer);
        showWarn.timer = setTimeout(() => {
          warn.textContent = "";
          warn.style.display = "none";
        }, 4500);
      }
    }

    function normalizeText(text) {
      return String(text || "")
        .toLowerCase()
        .normalize("NFKD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[^\w\s:/.-]/g, "")
        .replace(/0/g, "o")
        .replace(/1/g, "i")
        .replace(/3/g, "e")
        .replace(/4/g, "a")
        .replace(/5/g, "s")
        .replace(/7/g, "t")
        .replace(/8/g, "b")
        .replace(/\s+/g, " ")
        .trim();
    }

    function isBlocked(text) {
      const raw = String(text || "");
      const clean = normalizeText(raw);

      if (!clean) return "Empty message.";
      if (raw.length > 350) return "Message is too long.";
      if (/(.)\1{12,}/.test(clean)) return "Spam blocked.";
      if (/(https?:\/\/|www\.){3,}/i.test(raw)) return "Too many links.";
      if (/\b\d{1,3}(\.\d{1,3}){3}\b/.test(raw)) return "IP addresses are blocked.";
      if (/\b(javascript|data|file|ftp|chrome|about|blob):/i.test(raw)) return "Unsafe link scheme blocked.";
      if (/\b(token|password|passwd|private key|api key|session id|cookie|address|phone number)\b/i.test(clean)) return "Sensitive info blocked.";
      if (clean.split(" ").length > 80) return "Message is too long.";

      const blockedPatterns = [
        /\bf+\s*u+\s*c+\s*k+\b/,
        /\bs+\s*h+\s*i+\s*t+\b/,
        /\bb+\s*i+\s*t+\s*c+\s*h+\b/,
        /\ba+\s*s+\s*s+\b/,
        /\bd+\s*i+\s*c+\s*k+\b/,
        /\bc+\s*u+\s*n+\s*t+\b/,
        /\bk+\s*y+\s*s+\b/,
        /\bk+\s*i+\s*l+\s*l+\s*y+\s*o+\s*u+\s*r+\s*s+\s*e+\s*l+\s*f+\b/,
        /\bi+\s*h+\s*a+\s*t+\s*e+\s*y+\s*o+\s*u+\b/,
        /\bd+\s*i+\s*e+\b/,
        /\bracist\b/,
        /\bnazi\b/,
        /\bterrorist\b/,
        /\bdox+\b/,
        /\bswat+\b/
      ];

      for (const pattern of blockedPatterns) {
        if (pattern.test(clean)) return "Blocked by chat filter.";
      }

      return "";
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, char => {
        return {
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#039;"
        }[char];
      });
    }

    function linkify(text) {
      const escaped = escapeHtml(text);

      return escaped.replace(/\b((https?:\/\/)?([a-zA-Z0-9-]+\.)+[a-zA-Z]{2,63}(\/[^\s<]*)?)/g, match => {
        let url = match;
        if (!/^https?:\/\//i.test(url)) url = "https://" + url;
        return `<a href="#" data-url="${escapeHtml(url)}">${escapeHtml(match)}</a>`;
      });
    }

    function addMessage(data) {
      const isMine = data.clientId === clientId;
      const el = document.createElement("div");
      el.className = "msg " + (isMine ? "mine" : "other");

      const nameColor = data.nameColor || "#8db6ff";
      const rainbow = data.rainbowName === true;

      el.innerHTML = `
        <div class="msg-top">
          <div class="name ${rainbow ? "rainbow" : ""}" style="${rainbow ? "" : `color:${escapeHtml(nameColor)}`}">${escapeHtml(data.name || "anon")}</div>
          <div class="time">${escapeHtml(new Date(data.time || Date.now()).toLocaleTimeString())}</div>
        </div>
        <div class="text">${linkify(data.text || "")}</div>
      `;

      el.querySelectorAll("a[data-url]").forEach(link => {
        link.addEventListener("click", event => {
          event.preventDefault();
          openInShell(link.dataset.url);
        });
      });

      messages.appendChild(el);
      messages.scrollTop = messages.scrollHeight;
    }

    function openInShell(url) {
      window.parent.postMessage({
        type: "open-url",
        value: url
      }, "*");
    }

    function connect() {
      clearTimeout(reconnectTimer);

      const wsUrl = `${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/chatws`;

      socket = new WebSocket(wsUrl);

      socket.addEventListener("open", () => {
        statusEl.textContent = "online";
      });

      socket.addEventListener("close", () => {
        statusEl.textContent = "reconnecting";
        reconnectTimer = setTimeout(connect, 1200);
      });

      socket.addEventListener("error", () => {
        statusEl.textContent = "error";
      });

      socket.addEventListener("message", event => {
        try {
          const data = JSON.parse(event.data);

          if (data.type === "history") {
            messages.innerHTML = "";
            for (const item of data.items) addMessage(item);
            if (!data.items.length) {
              messages.innerHTML = '<div class="system">No messages yet. Say something or paste a website.</div>';
            }
          }

          if (data.type === "message") {
            const empty = messages.querySelector(".system");
            if (empty) empty.remove();
            addMessage(data.item);
          }

          if (data.type === "error") {
            showWarn(data.message);
          }
        } catch {}
      });
    }

    function send() {
      const name = nameInput.value.trim() || "anon";
      const text = msgInput.value.trim();
      const now = Date.now();

      showWarn("");

      if (now - lastSent < 1200) {
        showWarn("Slow down.");
        return;
      }

      const nameBlocked = isBlocked(name);
      if (nameBlocked) {
        showWarn("Name blocked.");
        return;
      }

      const blocked = isBlocked(text);
      if (blocked) {
        showWarn(blocked);
        return;
      }

      if (!socket || socket.readyState !== WebSocket.OPEN) {
        showWarn("Chat is not connected.");
        return;
      }

      lastSent = now;
      localStorage.setItem("chatName", name);

      socket.send(JSON.stringify({
        clientId,
        name,
        text,
        nameColor: getNameColor(),
        rainbowName: getRainbowEnabled()
      }));

      msgInput.value = "";
    }

    sendBtn.addEventListener("click", send);

    msgInput.addEventListener("keydown", event => {
      if (event.key === "Enter") send();
    });

    connect();
  </script>
</body>
</html>
