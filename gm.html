<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title></title>
  <style>
    :root {
      --bg-1: #080616;
      --bg-2: #11103a;
      --purple: #9b5cff;
      --blue: #33b8ff;
      --cyan: #7df7ff;
      --white: rgba(255, 255, 255, 0.92);
      --muted: rgba(255, 255, 255, 0.68);
      --glass: rgba(255, 255, 255, 0.12);
      --glass-border: rgba(255, 255, 255, 0.24);
      --shadow: rgba(20, 12, 60, 0.45);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--white);
      background:
        radial-gradient(circle at 15% 15%, rgba(155, 92, 255, 0.38), transparent 34%),
        radial-gradient(circle at 82% 18%, rgba(51, 184, 255, 0.35), transparent 32%),
        radial-gradient(circle at 50% 90%, rgba(125, 247, 255, 0.16), transparent 36%),
        linear-gradient(135deg, var(--bg-1), var(--bg-2) 54%, #06142c);
      overflow-x: hidden;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      width: 34rem;
      height: 34rem;
      border-radius: 45% 55% 62% 38% / 45% 38% 62% 55%;
      pointer-events: none;
      z-index: -1;
      filter: blur(10px);
      animation: floatBlob 14s ease-in-out infinite alternate;
    }

    body::before {
      top: -10rem;
      left: -8rem;
      background: linear-gradient(135deg, rgba(155, 92, 255, 0.42), rgba(51, 184, 255, 0.12));
    }

    body::after {
      right: -12rem;
      bottom: -10rem;
      background: linear-gradient(135deg, rgba(51, 184, 255, 0.32), rgba(155, 92, 255, 0.2));
      animation-delay: -4s;
    }

    @keyframes floatBlob {
      from {
        transform: translate3d(0, 0, 0) rotate(0deg) scale(1);
      }
      to {
        transform: translate3d(3rem, -2rem, 0) rotate(18deg) scale(1.08);
      }
    }

    .page {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 56px;
    }

    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 16px 18px;
      border: 1px solid var(--glass-border);
      border-radius: 28px;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.16), rgba(255, 255, 255, 0.06));
      backdrop-filter: blur(24px) saturate(150%);
      -webkit-backdrop-filter: blur(24px) saturate(150%);
      box-shadow: 0 24px 80px var(--shadow), inset 0 1px 0 rgba(255, 255, 255, 0.22);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 800;
      letter-spacing: -0.03em;
    }

    .logo {
      width: 42px;
      height: 42px;
      border-radius: 16px;
      background:
        radial-gradient(circle at 34% 30%, rgba(255, 255, 255, 0.9), transparent 16%),
        linear-gradient(135deg, var(--purple), var(--blue));
      box-shadow: 0 0 32px rgba(92, 177, 255, 0.55);
    }

    .nav-links {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .nav a,
    .button {
      color: var(--white);
      text-decoration: none;
      font-weight: 700;
      font-size: 0.94rem;
    }

    .nav-links a {
      padding: 10px 14px;
      border-radius: 999px;
      color: var(--muted);
      transition: 180ms ease;
    }

    .nav-links a:hover {
      color: var(--white);
      background: rgba(255, 255, 255, 0.12);
    }

    .hero {
      display: grid;
      grid-template-columns: 1.05fr 0.95fr;
      gap: 28px;
      align-items: center;
      padding: 70px 0 36px;
    }

    .hero-copy {
      position: relative;
      padding: 38px;
      border: 1px solid var(--glass-border);
      border-radius: 38px;
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.16), rgba(255, 255, 255, 0.055));
      backdrop-filter: blur(26px) saturate(160%);
      -webkit-backdrop-filter: blur(26px) saturate(160%);
      box-shadow: 0 28px 100px rgba(5, 8, 30, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.26);
      overflow: hidden;
    }

    .hero-copy::after {
      content: "";
      position: absolute;
      inset: 1px;
      border-radius: 37px;
      background: linear-gradient(115deg, rgba(255, 255, 255, 0.24), transparent 32%, rgba(125, 247, 255, 0.08));
      pointer-events: none;
      mask-image: linear-gradient(#000, transparent 70%);
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 22px;
      padding: 9px 13px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: rgba(255, 255, 255, 0.09);
      color: var(--cyan);
      font-weight: 800;
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }

    h1 {
      max-width: 780px;
      font-size: clamp(3rem, 7vw, 6.35rem);
      line-height: 0.88;
      letter-spacing: -0.08em;
      margin-bottom: 22px;
    }

    .gradient-text {
      background: linear-gradient(100deg, #ffffff, #c4a8ff 32%, #7df7ff 72%, #ffffff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .hero p {
      max-width: 680px;
      color: var(--muted);
      font-size: clamp(1.04rem, 1.8vw, 1.25rem);
      line-height: 1.7;
      margin-bottom: 28px;
    }

    .hero-actions {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      align-items: center;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 50px;
      padding: 0 20px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: linear-gradient(135deg, rgba(155, 92, 255, 0.96), rgba(51, 184, 255, 0.86));
      box-shadow: 0 18px 44px rgba(60, 160, 255, 0.24), inset 0 1px 0 rgba(255, 255, 255, 0.28);
      transition: transform 180ms ease, box-shadow 180ms ease;
    }

    .button:hover {
      transform: translateY(-2px);
      box-shadow: 0 24px 60px rgba(60, 160, 255, 0.34), inset 0 1px 0 rgba(255, 255, 255, 0.34);
    }

    .button.secondary {
      background: rgba(255, 255, 255, 0.09);
      color: var(--white);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.18);
    }

    .orb-card {
      min-height: 560px;
      position: relative;
      border-radius: 42px;
      border: 1px solid var(--glass-border);
      background:
        radial-gradient(circle at 50% 35%, rgba(255, 255, 255, 0.2), transparent 20%),
        linear-gradient(145deg, rgba(255, 255, 255, 0.14), rgba(255, 255, 255, 0.045));
      backdrop-filter: blur(26px) saturate(160%);
      -webkit-backdrop-filter: blur(26px) saturate(160%);
      box-shadow: 0 28px 100px rgba(5, 8, 30, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.24);
      overflow: hidden;
    }

    .liquid-orb {
      position: absolute;
      width: 330px;
      height: 330px;
      left: 50%;
      top: 45%;
      transform: translate(-50%, -50%);
      border-radius: 42% 58% 62% 38% / 45% 42% 58% 55%;
      background:
        radial-gradient(circle at 34% 24%, rgba(255, 255, 255, 0.95), transparent 10%),
        radial-gradient(circle at 68% 72%, rgba(125, 247, 255, 0.46), transparent 26%),
        linear-gradient(135deg, rgba(155, 92, 255, 0.94), rgba(51, 184, 255, 0.78));
      box-shadow:
        0 0 80px rgba(155, 92, 255, 0.42),
        0 0 120px rgba(51, 184, 255, 0.34),
        inset 18px 22px 50px rgba(255, 255, 255, 0.24),
        inset -28px -34px 68px rgba(5, 8, 35, 0.24);
      animation: morph 8s ease-in-out infinite alternate;
    }

    @keyframes morph {
      0% { border-radius: 42% 58% 62% 38% / 45% 42% 58% 55%; transform: translate(-50%, -50%) rotate(0deg); }
      50% { border-radius: 58% 42% 38% 62% / 55% 58% 42% 45%; }
      100% { border-radius: 45% 55% 48% 52% / 62% 38% 58% 42%; transform: translate(-50%, -50%) rotate(16deg); }
    }

    .stat-stack {
      position: absolute;
      inset: auto 24px 24px 24px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .stat {
      padding: 16px;
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: rgba(255, 255, 255, 0.11);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    .stat strong {
      display: block;
      font-size: 1.45rem;
      letter-spacing: -0.04em;
    }

    .stat span {
      color: var(--muted);
      font-size: 0.82rem;
    }

    .section-title {
      margin: 44px 0 18px;
      font-size: clamp(2rem, 4vw, 3.4rem);
      letter-spacing: -0.06em;
    }

    .games-shell {
      position: relative;
      margin-top: 36px;
      padding: 18px;
      border-radius: 38px;
      border: 1px solid var(--glass-border);
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.14), rgba(255, 255, 255, 0.055));
      backdrop-filter: blur(26px) saturate(145%);
      -webkit-backdrop-filter: blur(26px) saturate(145%);
      box-shadow: 0 28px 100px rgba(5, 8, 30, 0.42), inset 0 1px 0 rgba(255, 255, 255, 0.22);
      overflow: hidden;
    }

    .games-shell::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 20% 0%, rgba(155, 92, 255, 0.18), transparent 28%), radial-gradient(circle at 80% 0%, rgba(51, 184, 255, 0.18), transparent 26%);
      pointer-events: none;
    }

    .games-header {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 18px;
      padding: 14px 14px 22px;
    }

    .games-header p {
      color: var(--muted);
      margin-top: 8px;
      line-height: 1.6;
    }

    #games {
      position: relative;
      z-index: 1;
      min-height: 540px;
      border-radius: 28px;
      overflow: hidden;
      background: rgba(4, 7, 24, 0.56);
      border: 1px solid rgba(255, 255, 255, 0.14);
    }

    .fallback {
      padding: 28px;
      color: var(--muted);
      line-height: 1.7;
    }

    .feature-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-top: 22px;
    }

    .feature {
      padding: 22px;
      border-radius: 28px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: rgba(255, 255, 255, 0.09);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.14);
    }

    .feature h3 {
      margin-bottom: 10px;
      letter-spacing: -0.03em;
    }

    .feature p {
      color: var(--muted);
      line-height: 1.6;
      font-size: 0.95rem;
    }

    footer {
      padding: 42px 0 0;
      color: rgba(255, 255, 255, 0.5);
      text-align: center;
      font-size: 0.92rem;
    }

    @media (max-width: 900px) {
      .hero {
        grid-template-columns: 1fr;
        padding-top: 44px;
      }

      .orb-card {
        min-height: 420px;
      }

      .feature-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 620px) {
      .page {
        width: min(100% - 20px, 1180px);
        padding-top: 10px;
      }

      .nav,
      .games-header,
      .hero-actions {
        align-items: stretch;
        flex-direction: column;
      }

      .nav-links {
        justify-content: flex-start;
      }

      .hero-copy {
        padding: 26px;
        border-radius: 30px;
      }

      .stat-stack,
      .feature-grid {
        grid-template-columns: 1fr;
      }

      .liquid-orb {
        width: 240px;
        height: 240px;
      }
    }
  </style>
</head>
<body>
  <main class="page">


  

    <section id="games-section" class="games-shell">
      <div class="games-header">
        <div>
          <h2 class="section-title">Play g?me?s</h2>
          <p>all your favorite g?me?s in one place</p>
        </div>
      </div>

      <div id="games">
        <div class="fallback">Loading the library...</div>
      </div>
    </section>

    

  </main>

  <script src="https://cdn.jsdelivr.net/gh/luminsdk/script@latest/lumin.min.js"></script>
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const games = document.querySelector('#games');

      if (!window.Lumin || !games) {
        games.innerHTML = '<div class="fallback">g?me?s could not load. Check your internet connection or CDN access.</div>';
        return;
      }

      Lumin.init({
        container: '#games',
        theme: 'dark'
      });
    });
  </script>
</body>
</html>
